<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Institution | RwandaGuide</title>

<style>

:root{
    --bg:#f5f7fa;
    --card:#ffffff;
    --text:#17212b;
    --muted:#64748b;
    --border:#dce3ea;
    --header:#07111f;
    --primary:#1677d2;
}

body.dark{
    --bg:#07111f;
    --card:#101d2d;
    --text:#f1f5f9;
    --muted:#aab7c7;
    --border:#293c50;
    --header:#020914;
    --primary:#3b9cff;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.2s;
}

header{
    background:var(--header);
    color:white;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header a{
    color:#8ec8ff;
    text-decoration:none;
}

.theme{
    border:1px solid #53677d;
    background:transparent;
    color:white;
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
}

.back{
    display:inline-block;
    margin:20px 7%;
    padding:10px 15px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:8px;
    color:var(--text);
    text-decoration:none;
}

.container{
    max-width:950px;
    margin:10px auto 40px;
    padding:20px;
}

.card{
    background:var(--card);
    padding:35px;
    border-radius:18px;
    border:1px solid var(--border);
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

.icon{font-size:60px}

h1{
    font-size:38px;
    margin:10px 0;
}

.category{
    color:#2385d0;
    font-weight:bold;
}

.badge{
    display:inline-block;
    margin:15px 0;
    padding:7px 12px;
    background:#e9f4ff;
    color:#1766a7;
    border-radius:20px;
}

.description{
    line-height:1.7;
    color:var(--muted);
}

.info{
    margin-top:30px;
}

.info div{
    padding:13px 0;
    border-bottom:1px solid var(--border);
}

.info a{
    color:#2385d0;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:30px;
    flex-wrap:wrap;
}

.actions a,
.actions button{
    padding:13px 18px;
    border:0;
    border-radius:9px;
    text-decoration:none;
    cursor:pointer;
    background:var(--primary);
    color:white;
}

.actions .secondary{
    background:#e8f2fc;
    color:#1261a7;
}

body.dark .actions .secondary{
    background:#17334d;
    color:#8ec8ff;
}

</style>
</head>

<body>

<header>

<a href="rwandaguide.html">
RwandaGuide
</a>

<button class="theme"
        onclick="toggleTheme()"
        id="themeBtn">
🌙 Dark
</button>

</header>

<a class="back" href="javascript:history.back()">
← Back
</a>

<div class="container">
<div id="content"></div>
</div>

<script>

const demoInstitutions=[

{
id:"demo-government",
name:"Rwanda Government",
category:"Government",
icon:"🏛",
description:"Demo institution record for RwandaGuide.",
province:"Kigali City",
district:"Gasabo",
sector:"Kacyiru",
address:"Kacyiru, Kigali",
latitude:-1.9441,
longitude:30.0619,
services:["Government services"],
phone:"",
email:"",
website:"",
verification:"Demo / Unverified"
},

{
id:"demo-health",
name:"Demo Health Institution",
category:"Health",
icon:"🏥",
description:"Demo health institution record.",
province:"Kigali City",
district:"Gasabo",
sector:"Kacyiru",
address:"Kigali, Rwanda",
latitude:-1.9441,
longitude:30.0619,
services:["Healthcare"],
phone:"",
email:"",
website:"",
verification:"Demo / Unverified"
},

{
id:"demo-education",
name:"Demo Education Institution",
category:"Education",
icon:"🎓",
description:"Demo education institution record.",
province:"Northern Province",
district:"Musanze",
sector:"Musanze",
address:"Musanze, Rwanda",
latitude:-1.5015,
longitude:29.6108,
services:["Education"],
phone:"",
email:"",
website:"",
verification:"Demo / Unverified"
}

];

function getData(){

    const saved=
        localStorage.getItem("rwandaGuideInstitutions");

    if(saved){

        try{

            const data=JSON.parse(saved);

            if(Array.isArray(data)) return data;

        }catch(e){}

    }

    return demoInstitutions;
}

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

const params=
    new URLSearchParams(window.location.search);

const id=params.get("id");

const institution=
    getData().find(item=>item.id===id);

const content=
    document.getElementById("content");

if(!institution){

    content.innerHTML=`

    <div class="card">

        <h1>Institution not found</h1>

        <p class="description">
            This institution does not exist in the RwandaGuide database.
        </p>

    </div>

    `;

}else{

    const services=
        Array.isArray(institution.services)
        ? institution.services.join(", ")
        : institution.services || "";

    content.innerHTML=`

    <div class="card">

        <div class="icon">
            ${escapeHTML(institution.icon || "🏢")}
        </div>

        <h1>
            ${escapeHTML(institution.name)}
        </h1>

        <div class="category">
            ${escapeHTML(institution.category)}
        </div>

        <div class="badge">
            ${escapeHTML(institution.verification || "Unverified")}
        </div>

        <p class="description">
            ${escapeHTML(institution.description)}
        </p>

        <div class="info">

            <div>
                <strong>Province:</strong>
                ${escapeHTML(institution.province)}
            </div>

            <div>
                <strong>District:</strong>
                ${escapeHTML(institution.district)}
            </div>

            <div>
                <strong>Sector:</strong>
                ${escapeHTML(institution.sector)}
            </div>

            <div>
                <strong>Address:</strong>
                ${escapeHTML(institution.address)}
            </div>

            <div>
                <strong>Services:</strong>
                ${escapeHTML(services)}
            </div>

            <div>
                <strong>Phone:</strong>
                ${escapeHTML(institution.phone)}
            </div>

            <div>
                <strong>Email:</strong>
                ${escapeHTML(institution.email)}
            </div>

            <div>
                <strong>Website:</strong>

                ${
                    institution.website
                    ? `<a href="${escapeHTML(institution.website)}"
                          target="_blank"
                          rel="noopener">
                          Official Website
                       </a>`
                    : "Not available"
                }

            </div>

        </div>

        <div class="actions">

            <a href="map.html?id=${encodeURIComponent(institution.id)}">
                🗺 View on Map
            </a>

            <button class="secondary"
                    onclick="directions()">
                📍 Get Directions
            </button>

        </div>

    </div>

    `;

    window.directions=function(){

        window.open(
            `https://www.google.com/maps/dir/?api=1&destination=${institution.latitude},${institution.longitude}`,
            "_blank"
        );

    };

}

function applyTheme(){

    const dark=
        localStorage.getItem("rwandaGuideTheme")==="dark";

    document.body.classList.toggle("dark",dark);

    document.getElementById("themeBtn").textContent=
        dark ? "☀️ White" : "🌙 Dark";
}

function toggleTheme(){

    const dark=
        document.body.classList.contains("dark");

    localStorage.setItem(
        "rwandaGuideTheme",
        dark ? "light" : "dark"
    );

    applyTheme();
}

applyTheme();

</script>

</body>
</html>
