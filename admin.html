<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RwandaGuide Admin</title>

<style>

:root{
    --bg:#f4f7fa;
    --card:#ffffff;
    --text:#17212b;
    --muted:#667483;
    --border:#dce3ea;
    --header:#07111f;
    --primary:#1677d2;
}

body.dark{
    --bg:#07111f;
    --card:#101d2d;
    --text:#f1f5f9;
    --muted:#aab7c7;
    --border:#293c50;
    --header:#020914;
    --primary:#3b9cff;
}

*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:var(--bg);
    color:var(--text);
    transition:.2s;
}

header{
    background:var(--header);
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

header strong{
    font-size:22px;
}

.headerButtons{
    display:flex;
    gap:8px;
    align-items:center;
}

header button{
    border:1px solid #53677d;
    background:transparent;
    color:white;
    padding:9px 13px;
    border-radius:7px;
    cursor:pointer;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:30px 20px;
}

.back{
    display:inline-block;
    margin-bottom:20px;
    color:var(--text);
    text-decoration:none;
    background:var(--card);
    border:1px solid var(--border);
    padding:9px 14px;
    border-radius:8px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(
        auto-fit,
        minmax(180px,1fr)
    );
    gap:15px;
    margin-bottom:30px;
}

.stat{
    background:var(--card);
    padding:20px;
    border-radius:12px;
    border:1px solid var(--border);
}

.stat strong{
    display:block;
    font-size:30px;
    margin-top:8px;
}

.form-card,
.list-card{
    background:var(--card);
    padding:25px;
    border-radius:14px;
    border:1px solid var(--border);
    margin-bottom:25px;
}

.form-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(230px,1fr));
    gap:15px;
}

.field{
    display:flex;
    flex-direction:column;
}

.field.full{
    grid-column:1/-1;
}

label{
    font-weight:bold;
    margin-bottom:7px;
}

input,
textarea,
select{
    padding:11px;
    border:1px solid var(--border);
    background:var(--card);
    color:var(--text);
    border-radius:7px;
    font-family:inherit;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    border:0;
    padding:11px 17px;
    border-radius:7px;
    cursor:pointer;
    background:var(--primary);
    color:white;
}

button.secondary{
    background:#6b7785;
}

button.danger{
    background:#d83a3a;
}

.institution{
    border:1px solid var(--border);
    border-radius:10px;
    padding:18px;
    margin-top:12px;
}

.institution h3{
    margin:0 0 5px;
}

.meta{
    color:var(--muted);
    font-size:14px;
    line-height:1.6;
}

.list-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
}

.search{
    width:100%;
    margin-bottom:15px;
}

.message{
    margin-top:12px;
    color:#2385d0;
    font-weight:bold;
}

</style>
</head>

<body>

<script>

if(
    sessionStorage.getItem("rwandaGuideAdmin")
    !== "true"
){

    window.location.href="admin-login.html";

}

</script>

<header>

<strong>
    RwandaGuide Admin
</strong>

<div class="headerButtons">

<button onclick="toggleTheme()" id="themeBtn">
    🌙
</button>

<button onclick="logout()">
    Logout
</button>

</div>

</header>

<div class="container">

<a class="back" href="rwandaguide.html">
    ← Back to RwandaGuide
</a>

<div class="stats">

<div class="stat">
    Total Institutions
    <strong id="total">0</strong>
</div>

<div class="stat">
    Verified
    <strong id="verified">0</strong>
</div>

<div class="stat">
    Unverified
    <strong id="unverified">0</strong>
</div>

</div>

<div class="form-card">

<h2 id="formTitle">
    Add Institution
</h2>

<form onsubmit="saveInstitution(event)">

<input type="hidden" id="editId">

<div class="form-grid">

<div class="field">
<label>Name</label>
<input id="name" required>
</div>

<div class="field">
<label>Category</label>

<select id="category" required>

<option>Government</option>
<option>Health</option>
<option>Education</option>
<option>Justice</option>
<option>Public Safety</option>
<option>Finance</option>
<option>Organizations</option>
<option>Business</option>

</select>

</div>

<div class="field">
<label>Icon</label>
<input id="icon" placeholder="🏢">
</div>

<div class="field full">
<label>Description</label>
<textarea id="description"></textarea>
</div>

<div class="field">
<label>Province</label>
<input id="province">
</div>

<div class="field">
<label>District</label>
<input id="district">
</div>

<div class="field">
<label>Sector</label>
<input id="sector">
</div>

<div class="field">
<label>Address</label>
<input id="address">
</div>

<div class="field">
<label>Latitude</label>
<input id="latitude" type="number" step="any">
</div>

<div class="field">
<label>Longitude</label>
<input id="longitude" type="number" step="any">
</div>

<div class="field full">
<label>Services</label>

<input
id="services"
placeholder="Education, Research, Training"
>

</div>

<div class="field">
<label>Phone</label>
<input id="phone">
</div>

<div class="field">
<label>Email</label>
<input id="email" type="email">
</div>

<div class="field">
<label>Official Website</label>
<input id="website" type="url">
</div>

<div class="field">
<label>Verification</label>

<select id="verification">

<option>Verified</option>
<option>Unverified</option>
<option>Pending Verification</option>

</select>

</div>

</div>

<div class="actions">

<button type="submit">
    Save Institution
</button>

<button
type="button"
class="secondary"
onclick="resetForm()">
    Clear
</button>

</div>

<div id="message" class="message"></div>

</form>

</div>

<div class="list-card">

<h2>Institutions</h2>

<br>

<input
class="search"
id="listSearch"
placeholder="Search institutions..."
oninput="renderList()"
>

<div id="institutionList"></div>

</div>

</div>

<script>

function getData(){

    const saved=
        localStorage.getItem(
            "rwandaGuideInstitutions"
        );

    if(saved){

        try{

            const data=JSON.parse(saved);

            if(Array.isArray(data)) return data;

        }catch(e){}

    }

    return [];

}

function saveData(data){

    localStorage.setItem(
        "rwandaGuideInstitutions",
        JSON.stringify(data)
    );

}

function escapeHTML(value){

    return String(value || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

function saveInstitution(event){

    event.preventDefault();

    const data=getData();

    const editId=
        document.getElementById("editId").value;

    const services=
        document.getElementById("services")
        .value.split(",")
        .map(x=>x.trim())
        .filter(Boolean);

    const institution={

        id:
            editId ||
            "institution-"+Date.now(),

        name:
            document.getElementById("name").value.trim(),

        category:
            document.getElementById("category").value,

        icon:
            document.getElementById("icon").value.trim()
            || "🏢",

        description:
            document.getElementById("description").value.trim(),

        province:
            document.getElementById("province").value.trim(),

        district:
            document.getElementById("district").value.trim(),

        sector:
            document.getElementById("sector").value.trim(),

        address:
            document.getElementById("address").value.trim(),

        latitude:
            parseFloat(
                document.getElementById("latitude").value
            ),

        longitude:
            parseFloat(
                document.getElementById("longitude").value
            ),

        services,

        phone:
            document.getElementById("phone").value.trim(),

        email:
            document.getElementById("email").value.trim(),

        website:
            document.getElementById("website").value.trim(),

        verification:
            document.getElementById("verification").value

    };

    if(editId){

        const index=
            data.findIndex(x=>x.id===editId);

        if(index!==-1){
            data[index]=institution;
        }

    }else{

        data.push(institution);

    }

    saveData(data);

    document.getElementById("message").textContent=
        editId
        ? "Institution updated successfully."
        : "Institution added successfully.";

    resetForm();
    renderList();
    updateStats();

}

function editInstitution(id){

    const item=
        getData().find(x=>x.id===id);

    if(!item) return;

    document.getElementById("editId").value=item.id;
    document.getElementById("name").value=item.name || "";
    document.getElementById("category").value=item.category || "Education";
    document.getElementById("icon").value=item.icon || "";
    document.getElementById("description").value=item.description || "";
    document.getElementById("province").value=item.province || "";
    document.getElementById("district").value=item.district || "";
    document.getElementById("sector").value=item.sector || "";
    document.getElementById("address").value=item.address || "";
    document.getElementById("latitude").value=item.latitude ?? "";
    document.getElementById("longitude").value=item.longitude ?? "";

    document.getElementById("services").value=
        Array.isArray(item.services)
        ? item.services.join(", ")
        : item.services || "";

    document.getElementById("phone").value=item.phone || "";
    document.getElementById("email").value=item.email || "";
    document.getElementById("website").value=item.website || "";
    document.getElementById("verification").value=
        item.verification || "Unverified";

    document.getElementById("formTitle").textContent=
        "Edit Institution";

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

function deleteInstitution(id){

    const item=
        getData().find(x=>x.id===id);

    if(!item) return;

    if(!confirm(`Delete "${item.name}"?`)) return;

    saveData(
        getData().filter(x=>x.id!==id)
    );

    renderList();
    updateStats();

}

function resetForm(){

    document.getElementById("editId").value="";

    document.querySelector("form").reset();

    document.getElementById("formTitle").textContent=
        "Add Institution";

}

function renderList(){

    const container=
        document.getElementById("institutionList");

    const search=
        document.getElementById("listSearch")
        .value.toLowerCase().trim();

    const data=
        getData().filter(item=>
            (
                item.name+" "+
                item.category+" "+
                item.district
            )
            .toLowerCase()
            .includes(search)
        );

    if(data.length===0){

        container.innerHTML=
            "<p>No institutions found.</p>";

        return;

    }

    container.innerHTML=
        data.map(item=>`

        <div class="institution">

            <h3>
                ${escapeHTML(item.icon || "🏢")}
                ${escapeHTML(item.name)}
            </h3>

            <div class="meta">

                Category:
                ${escapeHTML(item.category)}

                <br>

                Location:
                ${escapeHTML(item.district)}
                ${item.sector
                    ? ", "+escapeHTML(item.sector)
                    : ""
                }

                <br>

                Verification:
                ${escapeHTML(item.verification)}

            </div>

            <div class="list-actions">

                <button
                onclick="editInstitution('${item.id}')">
                    Edit
                </button>

                <button
                class="danger"
                onclick="deleteInstitution('${item.id}')">
                    Delete
                </button>

            </div>

        </div>

        `).join("");

}

function updateStats(){

    const data=getData();

    document.getElementById("total").textContent=
        data.length;

    document.getElementById("verified").textContent=
        data.filter(
            x=>x.verification==="Verified"
        ).length;

    document.getElementById("unverified").textContent=
        data.filter(
            x=>x.verification!=="Verified"
        ).length;

}

function logout(){

    sessionStorage.removeItem(
        "rwandaGuideAdmin"
    );

    window.location.href="admin-login.html";

}

function applyTheme(){

    const dark=
        localStorage.getItem("rwandaGuideTheme")==="dark";

    document.body.classList.toggle("dark",dark);

    document.getElementById("themeBtn").textContent=
        dark ? "☀️ White" : "🌙 Dark";
}

function toggleTheme(){

    const dark=
        document.body.classList.contains("dark");

    localStorage.setItem(
        "rwandaGuideTheme",
        dark ? "light" : "dark"
    );

    applyTheme();

}

applyTheme();
renderList();
updateStats();

</script>

</body>
</html>
